services:
  postgres:
    image: postgres:16-alpine
    container_name: riff-postgres
    environment:
      POSTGRES_USER: riff
      POSTGRES_PASSWORD: riff_dev
      POSTGRES_DB: riff
    ports:
      - "5433:5432"       # 5433 on the host so it never collides with another project's Postgres
    volumes:
      - riff_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riff -d riff"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: riff-redis
    ports:
      - "6380:6379"
volumes:
  riff_pgdata:
